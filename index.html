<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clases CCNAv7 [ENSA] | Instructor Gustavo Spinetti</title>
  <link rel="icon" type="image/x-icon" href="imagenes/favicon_red.ico">

  <style>
    :root {
      --primary-color: #0b3c5d;      /* Azul Cisco institucional */
      --secondary-color: #0288d1;    /* Azul dinámico / enlaces */
      --accent-color: #d92525;       /* Rojo de acento */
      --bg-color: #f4f7f9;           /* Fondo gris claro limpio */
      --card-bg: #ffffff;
      --text-main: #0b3c5d;          /* Títulos y textos principales en azul */
      --text-muted: #0b3c5d;         /* Subtítulos en azul */
      --border-color: #e2e8f0;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --transition: all 0.25s ease-in-out;
    }

    /* MODO OSCURO */
    body.dark-mode {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #38bdf8;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 20px 15px;
      width: 100%;
      flex: 1;
    }

    /* BARRA SUPERIOR DE ACCIONES */
    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn-action {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 14px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: var(--transition);
    }

    .btn-action:hover {
      border-color: var(--secondary-color);
      color: var(--secondary-color);
      transform: translateY(-1px);
    }

    /* HEADER */
    .header-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 25px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
      border-top: 5px solid var(--primary-color);
    }

    .header-logo {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: var(--shadow);
      background-color: #ffffff;
      flex-shrink: 0;
    }

    .header-content {
      text-align: center;
      flex: 1;
    }

    .header-content h1 {
      font-size: 1.5rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .header-content h2 {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .header-content .instructor {
      font-size: 1.15rem;
      color: var(--text-main);
      font-weight: 600;
      margin-top: 6px;
    }

    /* BARRA DE BÚSQUEDA REDONDEADA Y COMPACTA */
    .search-wrapper {
      max-width: 550px;
      margin: 0 auto 10px auto;
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 10px 20px 10px 42px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 50px;
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    /* CONTADOR DINÁMICO */
    .search-counter {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 25px;
      font-weight: 500;
    }

    .no-results {
      text-align: center;
      padding: 30px 20px;
      font-size: 1.05rem;
      color: var(--text-muted);
      display: none;
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 25px;
    }

    /* GRID DE CLASES */
    .classes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .class-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .class-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    }

    .badge-latest {
      position: absolute;
      top: 12px;
      right: 12px;
      background
